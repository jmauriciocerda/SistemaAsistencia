<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Asistencia Lecaros SPA</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="app">

    <!-- Encabezado -->

    <header class="header">

        <img
            src="assets/logo.png"
            alt="Logo Lecaros SPA"
            class="logo"
            style="width:100px; max-width:100px; height:auto;">

        <h1>Control de Asistencia</h1>

        <h2>Lecaros SPA</h2>

    </header>

    <!-- Tarjeta principal -->

    <main class="card">

        <div id="fechaHora" class="fechaHora"></div>

        <!-- Lector QR -->

        <div class="scanner-container">

            <button
                id="btnScan"
                class="scan-btn">

                📷 Escanear credencial

            </button>

            <div id="reader"></div>

            <p class="scanner-text">

                Acerque su credencial al lector

            </p>

        </div>

        <!-- Información trabajador -->

        <div
            id="trabajador"
            class="trabajador oculto">

            <h3 id="nombreTrabajador"></h3>

            <p id="cargoTrabajador"></p>

        </div>

        <!-- Botones -->

        <div class="botones">

            <button
                id="btnEntrada"
                class="entrada"
                onclick="marcar('Entrada')"
                disabled>

                🟢 Marcar Entrada

            </button>

            <button
                id="btnSalida"
                class="salida"
                onclick="marcar('Salida')"
                disabled>

                🔴 Marcar Salida

            </button>

        </div>

        <div
            id="resultado"
            class="resultado">

        </div>

    </main>

    <footer class="footer">

        Sistema de Asistencia © Lecaros SPA

    </footer>

</div>

<!-- Librería lector QR -->

<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Aplicación -->

<script src="js/app.js"></script>

</body>

</html>
