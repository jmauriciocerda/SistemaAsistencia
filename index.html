<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Asistencia Lecaros SPA</title>

    <link rel="stylesheet" href="css/styles.css?v=3">

</head>


<body>

<div class="app">


    <!-- ========================= -->
    <!-- ENCABEZADO -->
    <!-- ========================= -->

    <header class="header">

        <img
            src="assets/logo.png"
            alt="Logo Lecaros SPA"
            class="logo"
            style="width:100px; max-width:100px; height:auto;">

        <h1>Control de Asistencia</h1>

        <h2>Lecaros SPA</h2>

    </header>



    <!-- ========================= -->
    <!-- TARJETA PRINCIPAL -->
    <!-- ========================= -->

    <main class="card">


        <!-- Fecha y hora -->

        <div id="fechaHora" class="fechaHora"></div>



        <!-- ========================= -->
        <!-- LECTOR QR -->
        <!-- ========================= -->

        <div class="scanner-container">

            <button
                id="btnScan"
                class="scan-btn">

                📷 Escanear credencial

            </button>


            <div id="reader"></div>


            <p class="scanner-text">

                Acerque su credencial al lector

            </p>

        </div>



        <!-- ========================= -->
        <!-- INGRESO MANUAL -->
        <!-- ========================= -->

        <hr class="separador">


        <div class="manual-login">

            <p class="manual-title">

                ¿Problemas con el código QR?

            </p>


            <input
                type="text"
                id="rutManual"
                placeholder="Ingrese su RUT">


            <button
                id="btnRut"
                class="scan-btn"
                onclick="buscarPorRut()">

                Buscar trabajador

            </button>

        </div>



        <!-- ========================= -->
        <!-- DATOS TRABAJADOR -->
        <!-- ========================= -->

        <div
            id="trabajador"
            class="trabajador oculto">

            <h3 id="nombreTrabajador"></h3>

            <p id="cargoTrabajador"></p>

        </div>



        <!-- ========================= -->
        <!-- BOTONES -->
        <!-- ========================= -->

        <div class="botones">

            <button
                id="btnEntrada"
                class="entrada"
                onclick="marcar('Entrada')"
                disabled>

                🟢 Marcar Entrada

            </button>


            <button
                id="btnSalida"
                class="salida"
                onclick="marcar('Salida')"
                disabled>

                🔴 Marcar Salida

            </button>

        </div>



        <!-- ========================= -->
        <!-- FORMULARIO OF -->
        <!-- ========================= -->

        <div
            id="formularioOF"
            class="formulario-of"
            style="display:none;">

            <h3>Registrar salida</h3>

            <p>
                Ingrese el número de OF en la que trabajó:
            </p>


            <input
                type="text"
                id="ofManual"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Número de OF">


            <div class="botones-of">

                <button
                    type="button"
                    class="entrada"
                    onclick="confirmarSalida()">

                    ✓ Confirmar salida

                </button>


                <button
                    type="button"
                    class="salida"
                    onclick="cancelarSalida()">

                    ✕ Cancelar

                </button>

            </div>

        </div>



        <!-- Resultado -->

        <div
            id="resultado"
            class="resultado">

        </div>


    </main>



    <footer class="footer">

        Sistema de Asistencia © Lecaros SPA

    </footer>



</div>



<!-- ========================= -->
<!-- LIBRERÍA LECTOR QR -->
<!-- ========================= -->

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>



<!-- ========================= -->
<!-- APLICACIÓN -->
<!-- ========================= -->

<script src="js/app.js?v=4"></script>


</body>

</html>
```
