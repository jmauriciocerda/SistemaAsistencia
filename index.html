<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcaje de Asistencia</title>
</head>

<body>

    <h1>Control de Asistencia</h1>

    <label>Nombre trabajador:</label>
    <br>
    <input type="text" id="nombre" placeholder="Ingrese su nombre">

    <br><br>

    <button onclick="marcar('Entrada')">
        Marcar Entrada
    </button>

    <button onclick="marcar('Salida')">
        Marcar Salida
    </button>

    <p id="resultado"></p>


<script>

function marcar(tipo){

    let nombre = document.getElementById("nombre").value;

    let fecha = new Date();

    let datos = {
        nombre: nombre,
        tipo: tipo,
        fecha: fecha.toLocaleDateString(),
        hora: fecha.toLocaleTimeString()
    };


    fetch("https://script.google.com/macros/s/AKfycbytEzLpf0rN9eFcdB2ASoJkxl51tZh2WUlObvo1Jt4K0J1USvnKzwsdkxUOn0Gv9Ctfkg/exec", {
        method: "POST",
        body: JSON.stringify(datos)
    })
    .then(respuesta => respuesta.text())
    .then(resultado => {

        document.getElementById("resultado").innerHTML =
        "Marcaje registrado: " + 
        nombre + " - " + tipo;

    })
    .catch(error => {

        document.getElementById("resultado").innerHTML =
        "Error al registrar";

        console.log(error);

    });

}

</script>

</body>
</html>
