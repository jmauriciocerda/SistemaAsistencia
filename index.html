<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Control de Asistencia Lecaros SPA</title>

    <link
        rel="stylesheet"
        href="css/styles.css?v=5"
    >

</head>

<body>

<div class="app">

    <!-- ==========================================
         ENCABEZADO
         ========================================== -->

    <header class="header">

        <img
            src="assets/logo.png"
            alt="Logo Lecaros SPA"
            class="logo"
            style="width:100px; max-width:100px; height:auto;"
        >

        <h1>
            Control de Asistencia
        </h1>

        <h2>
            Lecaros SPA
        </h2>

    </header>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
         ========================================== -->

    <main class="card">

        <!-- FECHA Y HORA -->

        <div
            id="fechaHora"
            class="fechaHora"
        ></div>


        <!-- ======================================
             LECTOR QR
             ====================================== -->

        <div class="scanner-container">

            <button
                id="btnScan"
                class="scan-btn"
            >
                📷 Escanear credencial
            </button>

            <div id="reader"></div>

            <p class="scanner-text">
                Acerque su credencial al lector
            </p>

        </div>


        <hr class="separador">


        <!-- ======================================
             INGRESO MANUAL DE RUT
             ====================================== -->

        <div class="manual-login">

            <p class="manual-title">
                ¿Problemas con el código QR?
            </p>

            <input
                type="text"
                id="rutManual"
                placeholder="Ingrese su RUT"
                autocomplete="off"
            >

            <button
                id="btnRut"
                class="scan-btn"
                onclick="buscarPorRut()"
            >
                Buscar trabajador
            </button>

        </div>


        <!-- ======================================
             INFORMACIÓN DEL TRABAJADOR
             ====================================== -->

        <div
            id="trabajador"
            class="trabajador oculto"
        >

            <h3 id="nombreTrabajador"></h3>

            <p id="cargoTrabajador"></p>

        </div>


        <!-- ======================================
             BOTONES ENTRADA / SALIDA
             ====================================== -->

        <div class="botones">

            <button
                id="btnEntrada"
                class="entrada"
                onclick="marcar('Entrada')"
                disabled
            >
                🟢 Marcar Entrada
            </button>

            <button
                id="btnSalida"
                class="salida"
                onclick="marcar('Salida')"
                disabled
            >
                🔴 Marcar Salida
            </button>

        </div>


        <!-- ======================================
             RESULTADO / MENSAJES
             ====================================== -->

        <div
            id="resultado"
            class="resultado"
        ></div>

    </main>


    <!-- ==========================================
         VENTANA INGRESO DE OF
         ========================================== -->

    <div
        id="formularioOF"
        class="modal-overlay"
        style="display:none;"
    >

        <div class="modal-of">

            <div class="modal-of-icon">
                🔴
            </div>

            <h3>
                Registrar salida
            </h3>

            <p
                class="modal-of-trabajador"
                id="nombreOFTrabajador"
            ></p>

            <div class="modal-of-separador"></div>

            <label for="ofManual">
                Orden de Fabricación
            </label>

            <p class="modal-of-ayuda">
                Ingrese la OF en la que trabajó durante su jornada.
            </p>

            <input
                type="number"
                id="ofManual"
                class="input-of"
                placeholder="Ingrese número de OF"
                inputmode="numeric"
                autocomplete="off"
            >

            <div class="modal-of-botones">

                <button
                    type="button"
                    class="btn-confirmar-of"
                    onclick="confirmarSalida()"
                >
                    ✓ Confirmar salida
                </button>

                <button
                    type="button"
                    class="btn-cancelar-of"
                    onclick="cancelarSalida()"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         PIE DE PÁGINA
         ========================================== -->

    <footer class="footer">

        Sistema de Asistencia © Lecaros SPA

    </footer>

</div>


<!-- ==========================================
     LIBRERÍA LECTOR QR
     ========================================== -->

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>


<!-- ==========================================
     JAVASCRIPT DEL SISTEMA
     ========================================== -->

<script src="js/app.js?v=5"></script>

</body>

</html>
