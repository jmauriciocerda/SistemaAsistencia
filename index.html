<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control Asistencia Lecaros SPA</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

<div class="container">

    <img src="assets/logo.png" style="width:100px !important; height:auto !important;">

    <h1>Control de Asistencia</h1>
    <h2>Lecaros SPA</h2>


    <div class="card">

        <label>Nombre trabajador</label>

        <input 
        id="nombre" 
        type="text" 
        placeholder="Ingrese su nombre">


        <button 
        class="entrada"
        onclick="marcar('Entrada')">
            🟢 Marcar Entrada
        </button>


        <button 
        class="salida"
        onclick="marcar('Salida')">
            🔴 Marcar Salida
        </button>


        <p id="resultado"></p>

    </div>


</div>


<script src="js/app.js"></script>

</body>

</html>
